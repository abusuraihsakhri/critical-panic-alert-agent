name: Critical Panic Alert Engine CI/CD & Security Verification

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install project and test dependencies
      run: python -m pip install -e ".[test]"

    - name: Check installed dependencies and Python syntax
      run: |
        python -m pip check
        python -m compileall -q agents critical_panic_alert_agent cli.py panic_alert_agent.py enrichment.py

    - name: Run Python test suite
      run: python -m pytest -q

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "22"

    - name: Check browser JavaScript
      run: |
        node --check web/app.js
        node --test web/app.test.cjs

