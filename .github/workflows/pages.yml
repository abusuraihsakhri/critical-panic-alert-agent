name: Deploy browser demonstration to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare static site
        run: |
          mkdir -p _site
          cp web/index.html web/app.js _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Smoke test published HTML and JavaScript
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -eu
          SITE_URL="${SITE_URL%/}/"
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error --location "$SITE_URL" -o /tmp/panic-index.html &&
               curl --fail --silent --show-error --location "${SITE_URL}app.js" -o /tmp/panic-app.js; then
              break
            fi
            sleep 5
          done
          grep -q 'id="run-audit"' /tmp/panic-index.html
          grep -q 'LOCAL_BROWSER_DEMONSTRATION' /tmp/panic-app.js
          echo "Verified published HTML and JS assets at $SITE_URL"
