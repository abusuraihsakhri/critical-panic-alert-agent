[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "critical-panic-alert-engine"
version = "2.0.0"
description = "PanicAlert Sentinel: Closed-Loop Laboratory Critical Value Escalation Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
critical-panic-alert-engine = "critical_panic_alert_agent.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/critical-panic-alert-engine"
Repository = "https://github.com/abusuraihsakhri/critical-panic-alert-engine.git"
