[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "critical-panic-alert-engine"
version = "2.0.0"
description = "PanicAlert Sentinel: Closed-Loop Laboratory Critical Value Escalation Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2,<3",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.setuptools]
py-modules = ["cli", "enrichment", "panic_alert_agent", "simulator", "critical_panic_alert_agent_app", "panic_alert_agent_app"]

[tool.setuptools.packages.find]
include = ["agents*", "critical_panic_alert_agent*"]

[project.scripts]
critical-panic-alert-engine = "critical_panic_alert_agent.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/critical-panic-alert-agent"
Repository = "https://github.com/abusuraihsakhri/critical-panic-alert-engine.git"
